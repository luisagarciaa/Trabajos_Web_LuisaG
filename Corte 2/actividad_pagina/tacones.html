<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHANEL | Tacones</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">CHANEL</a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="bolsas.html">Bolsas</a>
      <a href="tacones.html" class="activo">Zapatos</a>
      <a href="joyas.html">Joyas</a>
    </nav>
  </header>

  <main>
    <section class="titulo-pagina">
      <h1>Zapatos disponibles</h1>
    </section>

    <!-- Productos -->
    <section class="productos">

      <article class="producto">
        <div class="foto">
          <img src="imagenes/chanel kitten heels.jpg" alt="Chanel Kitten Heels" onerror="this.remove()">
        </div>
        <div class="info">
          <h3>Chanel Kitten Heels</h3>
          <p>Tacones elegantes, tacón de 6.5 cm.</p>
          <div class="detalles">
            <span class="precio">$1,150 USD</span>
          </div>
        </div>
      </article>

      <article class="producto">
        <div class="foto">
          <img src="imagenes/chanel flats.jpg" alt="Zapatos planos" onerror="this.remove()">
        </div>
        <div class="info">
          <h3>Zapatos planos</h3>
          <p>Comodos y elegantes.</p>
          <div class="detalles">
            <span class="precio">$1,300 USD</span>
          </div>
        </div>
      </article>

    </section>
  </main>

</body>
</html>
